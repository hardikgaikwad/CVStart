[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvstart"
version = "0.1.0"
description = "A Local-First, AI-Powered Agentic LaTeX Resume Builder"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CVstart Team" }
]
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14.0",
    "django-cors-headers>=4.3.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "pymupdf>=1.23.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
]

[project.scripts]
CVstart = "backend.cli:main"
cvstart = "backend.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
